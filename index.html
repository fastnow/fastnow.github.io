{t:"康威的生命游戏",u:"/game_of_life",c:"games",d:"2024-11-18",p:false,s:"经典的细胞自动机模拟游戏，支持自定义初始状态与速度调节"}];const CATS = [{k:'all',n:'全部项目'},{k:'tools',n:'实用工具'},{k:'games',n:'游戏模拟'},{k:'media',n:'媒体娱乐'},{k:'web',n:'网页应用'}];const state = {cat:'all', q:'', loaded:0, total:0, aplayer:false, timeoutId:null, countdownId:null};const $ = id => document.getElementById(id);const isExt = u => /^https?:\/\//i.test(u);function render(){const q = state.q.trim().toLowerCase();const list = PROJECTS.slice().filter(p => (state.cat==='all' || p.c===state.cat)).filter(p => !q || (p.t+' '+p.s).toLowerCase().includes(q)).sort((a,b) => a.p!==b.p ? (a.p?-1:1) : (a.d<b.d?1:a.d>b.d?-1:0));const grid = $('grid');if(!list.length){ grid.innerHTML = '<div class="empty">没有匹配的项目，换个关键词试试</div>'; return; }grid.innerHTML = list.map(p => `<a class="project-item" href="${p.u}" target="_blank"${isExt(p.u)?' rel="noopener"':''}><div class="project-head"><div class="project-title">${p.p?'<i class="fas fa-thumbtack pinned-icon" title="置顶项目"></i>':''}<span>${p.t}</span>${isExt(p.u)?'<i class="fas fa-arrow-up-right-from-square ext-icon" title="外部链接"></i>':''}</div><span class="project-date">${p.d}</span></div><div class="project-desc">${p.s}</div></a>`).join('');}function renderTabs(){$('tabs').innerHTML = CATS.map(c => {const n = c.k==='all' ? PROJECTS.length : PROJECTS.filter(p=>p.c===c.k).length;return `<button class="category-tab${c.k===state.cat?' active':''}" data-cat="${c.k}">${c.n}<span class="n">${n}</span></button>`;}).join('');$('tabs').querySelectorAll('.category-tab').forEach(b => {b.addEventListener('click', () => { state.cat = b.dataset.cat; renderTabs(); render(); });});}function applyTheme(t){document.documentElement.setAttribute('data-theme', t);$('themeToggle').querySelector('i').className = t==='dark' ? 'fas fa-sun' : 'fas fa-moon';document.querySelector('meta[name="theme-color"]').setAttribute('content', t==='dark'?'#15171a':'#f5f6f7');}applyTheme(localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));$('themeToggle').addEventListener('click', () => {const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';applyTheme(next); localStorage.setItem('theme', next);});let ticking = false;addEventListener('scroll', () => {if(ticking) return; ticking = true;requestAnimationFrame(() => { $('backToTop').classList.toggle('visible', scrollY > 320); ticking = false; });}, {passive:true});$('backToTop').addEventListener('click', () => scrollTo({top:0,behavior:'smooth'}));$('scrollDown').addEventListener('click', () => document.querySelector('.container').scrollIntoView({behavior:'smooth'}));let st;$('searchInput').addEventListener('input', e => {clearTimeout(st); st = setTimeout(() => { state.q = e.target.value; render(); }, 140);});const RES = [{url:'https://fastly.jsdelivr.net/npm/aplayer/dist/APlayer.min.css', type:'css', id:'aplayer-css', n:'CSS样式'},{url:'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css', type:'css', id:'fontawesome-css', n:'CSS样式'},{url:'https://www.loliapi.com/acg/', type:'img', n:'图片资源'},{url:'https://avatars.githubusercontent.com/u/177708607', type:'img', n:'图片资源'}];function addStep(prompt, content, ok){const box = $('loadingSteps'); if(!box) return;const line = document.createElement('div');line.className = 'step-line';line.innerHTML = `<span class="step-prompt">&gt;${prompt?' '+prompt:''}</span><span class="${ok?'step-success':'step-error'}">${content}</span>`;box.appendChild(line); box.scrollTop = box.scrollHeight;}function loadCss(r){if(document.getElementById(r.id)) return done();const l = document.createElement('link');l.rel='stylesheet'; l.href=r.url; l.id=r.id;l.onload = l.onerror = done;document.head.appendChild(l);}function loadImg(r){const i = new Image();i.onload = i.onerror = done;i.src = r.url;}function done(){state.loaded++;check();}function loadMusic(){addStep('加载音乐播放器','开始',true);const a = document.createElement('script');a.src = 'https://fastly.jsdelivr.net/npm/aplayer/dist/APlayer.min.js';a.id = 'aplayer-js';a.onload = () => {addStep('加载音乐播放器','APlayer.js 完成',true);const m = document.createElement('script');m.src = 'https://fastly.jsdelivr.net/npm/meting@2.0.1/dist/Meting.min.js';m.id = 'meting-js';m.onload = () => { addStep('加载音乐播放器','Meting.js 完成',true); state.aplayer = true; check(); };m.onerror = () => { addStep('加载音乐播放器','Meting.js 失败',false); state.aplayer = true; check(); };document.head.appendChild(m);};a.onerror = () => { addStep('加载音乐播放器','APlayer.js 失败',false); state.aplayer = true; check(); };document.head.appendChild(a);}function check(){if(state.loaded >= state.total && state.aplayer){if(state.timeoutId) clearTimeout(state.timeoutId);if(state.countdownId) clearInterval(state.countdownId);setTimeout(finish, 300);}}function finish(){const l = $('global-loader'); if(!l) return;addStep('页面启动中','成功',true);l.style.opacity = '0';setTimeout(() => {l.style.display = 'none';document.body.classList.remove('loading');$('banner').classList.add('loaded');if(window.Meting && document.querySelector('meting-js') && !document.querySelector('.aplayer')){try{ window.Meting.parse(); }catch(e){}}}, 300);}function forceCountdown(){let c = 5;addStep('加载超时', c+'s后强制进入', false);state.countdownId = setInterval(() => {c--; addStep('', c+'s', false);if(c<=0){ clearInterval(state.countdownId); state.aplayer = true; setTimeout(finish, 300); }if(state.loaded >= state.total && state.aplayer) clearInterval(state.countdownId);}, 1000);}document.addEventListener('DOMContentLoaded', () => {$('year').textContent = new Date().getFullYear();renderTabs(); render();state.total = RES.length;addStep('初始化','开始',true);state.timeoutId = setTimeout(() => {if(state.loaded < state.total || !state.aplayer) forceCountdown();}, 5000);RES.forEach(r => r.type==='css' ? loadCss(r) : loadImg(r));loadMusic();});</script></body></html>
